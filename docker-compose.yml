version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: socialmedia-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: socialnetwork
    volumes:
      - mongodb_data:/data/db

  app:
    build: .
    container_name: socialmedia-api
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/socialnetwork
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongodb_data: 